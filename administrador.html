<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberPro Mockup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0d14;
            --panel: #101827;
            --panel-2: #161f2d;
            --panel-3: #1c2738;
            --line: rgba(120, 142, 176, 0.25);
            --text: #edf3ff;
            --muted: #9ba8bf;
            --blue: #7eb0ff;
            --purple: #b071ff;
            --green: #50d7a4;
            --red: #ff5468;
            --shadow: rgba(0,0,0,.45);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #0a0d14 0%, #090d15 100%);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .mockup-shell {
            width: min(1380px, 96vw);
            margin: 18px auto;
            display: grid;
            grid-template-columns: 0.84fr 1.45fr 0.95fr;
            gap: 18px;
            padding: 12px;
            border: 1px solid var(--line);
            background: rgba(15, 21, 31, 0.86);
            box-shadow: 0 22px 50px rgba(0,0,0,.55);
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel {
            background: rgba(15, 22, 33, 0.95);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
            overflow: hidden;
        }

        .panel-header {
            height: 26px;
            background: rgba(17, 22, 30, 0.94);
            border-bottom: 1px solid rgba(255,255,255,.06);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 10px;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .browser-dots {
            display: flex;
            gap: 6px;
            margin-right: 12px;
        }

        .browser-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,.15);
        }

        .browser-dots span:nth-child(1) { background: #ff6b6b; }
        .browser-dots span:nth-child(2) { background: #ffd93d; }
        .browser-dots span:nth-child(3) { background: #6ee7b7; }

        .feature-photo {
            position: relative;
            min-height: 215px;
            background-image: linear-gradient(rgba(11,18,28,.2), rgba(11,18,28,.62)), url('https://images.unsplash.com/photo-1517832606299-7ae9b720a186?auto=format&fit=crop&w=900&q=80');
            background-size: cover;
            background-position: center;
        }

        .feature-photo::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 36%, rgba(6, 10, 18, .8) 100%);
        }

        .photo-label {
            position: absolute;
            left: 14px;
            bottom: 12px;
            z-index: 1;
            font-size: 12px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: rgba(255,255,255,.88);
            font-weight: 700;
            background: rgba(15, 22, 33, 0.5);
            padding: 6px 10px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 999px;
            backdrop-filter: blur(3px);
        }

        .mini-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
        }

        .mini-card {
            position: relative;
            min-height: 90px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--line);
            background-size: cover;
            background-position: center;
        }

        .mini-card:nth-child(1) { background-image: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.5)), url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=600&q=80'); }
        .mini-card:nth-child(2) { background-image: linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.55)), url('https://images.unsplash.com/photo-1521590832167-7e6ac6a77ce1?auto=format&fit=crop&w=600&q=80'); }
        .mini-card:nth-child(3) { background-image: linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.55)), url('https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&w=600&q=80'); }
        .mini-card:nth-child(4) { background-image: linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.5)), url('https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80'); }

        .mini-card .badge {
            position: absolute;
            left: 8px;
            bottom: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .08em;
        }

        .list-panel {
            padding: 10px 12px 12px;
        }

        .list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,.06);
            font-size: 12px;
            color: var(--muted);
        }

        .list-row:last-child { border-bottom: 0; }

        .list-name {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-weight: 600;
        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7789ff, #d0a7ff);
            border: 1px solid rgba(255,255,255,.4);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 52px;
            height: 22px;
            padding: 0 10px;
            border-radius: 999px;
            font-size: 10px;
            letter-spacing: .06em;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.03);
        }

        .desktop-panel {
            background: rgba(16, 22, 31, 0.97);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }

        .desktop-panel .desktop-header {
            height: 26px;
            background: rgba(15, 20, 28, 0.92);
            border-bottom: 1px solid rgba(255,255,255,.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 0 12px;
            font-weight: 600;
        }

        .desktop-body {
            padding: 14px;
            background: linear-gradient(180deg, rgba(17,22,29,.9), rgba(11,14,22,.95));
        }

        .storefront {
            position: relative;
            min-height: 240px;
            background: linear-gradient(rgba(8, 10, 16, 0.22), rgba(8, 10, 16, 0.7)), url('https://images.unsplash.com/photo-1521590832167-7e6ac6a77ce1?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.05);
            overflow: hidden;
        }

        .storefront::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,.32), rgba(0,0,0,.08), rgba(0,0,0,.28));
        }

        .login-box {
            position: absolute;
            inset: auto 18% 18px 18%;
            z-index: 1;
            background: rgba(42, 52, 67, 0.55);
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 12px;
            padding: 18px 18px 16px;
            backdrop-filter: blur(3px);
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }

        .login-box label {
            display: block;
            color: rgba(255,255,255,.8);
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .login-box .field {
            width: 100%;
            height: 34px;
            background: rgba(5,10,19,.55);
            border: 1px solid rgba(145, 169, 255, 0.35);
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
        }

        .login-box .cta {
            width: 100%;
            height: 34px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            background: linear-gradient(90deg, var(--purple), #7e8dff);
            box-shadow: 0 10px 24px rgba(124, 117, 255, 0.4);
        }

        .register-hero {
            position: relative;
            min-height: 150px;
            background: linear-gradient(rgba(18, 23, 32, 0.2), rgba(18, 23, 32, 0.8)), url('https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.05);
        }

        .register-bubble {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 18px;
            border: 1px solid rgba(183, 147, 255, 0.9);
            border-radius: 8px;
            background: rgba(18, 20, 30, 0.5);
            color: #d7beff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(176,113,255,.28);
        }

        .stats-box {
            background: rgba(16, 22, 31, 0.8);
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 8px;
            padding: 12px;
        }

        .stats-box .head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 10px;
        }

        .bars {
            display: flex;
            align-items: end;
            justify-content: space-between;
            height: 130px;
            gap: 8px;
            padding-top: 8px;
        }

        .bars span {
            display: block;
            flex: 1;
            background: linear-gradient(180deg, var(--purple), #7ea0ff 65%, #5aa8ff 100%);
            border-radius: 6px 6px 0 0;
            opacity: .95;
            box-shadow: inset 0 -8px 14px rgba(0,0,0,.18);
        }

        .bars span:nth-child(1) { height: 46%; }
        .bars span:nth-child(2) { height: 70%; }
        .bars span:nth-child(3) { height: 52%; }
        .bars span:nth-child(4) { height: 88%; }
        .bars span:nth-child(5) { height: 58%; }
        .bars span:nth-child(6) { height: 72%; }
        .bars span:nth-child(7) { height: 62%; }
        .bars span:nth-child(8) { height: 82%; }

        .mini-portraits {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-top: 9px;
        }

        .portrait {
            position: relative;
            min-height: 130px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.06);
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        .portrait.one {
            background-image: linear-gradient(rgba(10,14,20,.18), rgba(10,14,20,.72)), url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80');
        }

        .portrait.two {
            background-image: linear-gradient(rgba(10,14,20,.18), rgba(10,14,20,.72)), url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=900&q=80');
        }

        .portrait .meta {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: rgba(255,255,255,.9);
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        @media (max-width: 980px) {
            .mockup-shell {
                grid-template-columns: 1fr;
                width: min(90vw, 760px);
            }
        }
    </style>
</head>
<body>
    <div class="mockup-shell">
        <div class="stack">
            <div class="panel">
                <div class="panel-header">
                    <div class="browser-dots"><span></span><span></span><span></span></div>
                    <span>Frame 48</span>
                </div>
                <div class="feature-photo">
                    <div class="photo-label">BarberPro</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="browser-dots"><span></span><span></span><span></span></div>
                    <span>Portfolio</span>
                </div>
                <div class="mini-grid">
                    <div class="mini-card"><span class="badge badge bg-secondary">Corte</span></div>
                    <div class="mini-card"><span class="badge badge bg-secondary">Estilo</span></div>
                    <div class="mini-card"><span class="badge badge bg-secondary">Fade</span></div>
                    <div class="mini-card"><span class="badge badge bg-secondary">Perfil</span></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="browser-dots"><span></span><span></span><span></span></div>
                    <span>Clientes</span>
                </div>
                <div class="list-panel">
                    <div class="list-row">
                        <div class="list-name"><span class="avatar"></span>Mateo</div>
                        <span class="pill">Online</span>
                    </div>
                    <div class="list-row">
                        <div class="list-name"><span class="avatar" style="background:linear-gradient(135deg,#4ecdc4,#4ea5ff);"></span>Lucas</div>
                        <span class="pill">Live</span>
                    </div>
                    <div class="list-row">
                        <div class="list-name"><span class="avatar" style="background:linear-gradient(135deg,#ff9770,#ff5f7d);"></span>Javier</div>
                        <span class="pill">3:15</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="stack">
            <div class="desktop-panel">
                <div class="desktop-header">
                    <div class="browser-dots"><span></span><span></span><span></span></div>
                    <span>Desktop - 3</span>
                </div>
                <div class="desktop-body">
                    <div class="storefront">
                        <div class="login-box">
                            <label>Login</label>
                            <div class="field"></div>
                            <div class="field"></div>
                            <button class="cta">Entrar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="desktop-panel">
                <div class="desktop-header">
                    <div class="browser-dots"><span></span><span></span><span></span></div>
                    <span>Desktop - 2</span>
                </div>
                <div class="desktop-body">
                    <div class="register-hero">
                        <div class="register-bubble">Registrarse</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="stack">
            <div class="desktop-panel">
                <div class="desktop-header">
                    <div class="browser-dots"><span></span><span></span><span></span></div>
                    <span>Desktop - 4</span>
                </div>
                <div class="desktop-body">
                    <div class="stats-box">
                        <div class="head">
                            <span>Ventas</span>
                            <span class="text-success">+8.7%</span>
                        </div>
                        <div class="bars">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="desktop-panel">
                <div class="desktop-header">
                    <div class="browser-dots"><span></span><span></span><span></span></div>
                    <span>Desktop - 5</span>
                </div>
                <div class="desktop-body">
                    <div class="mini-portraits">
                        <div class="portrait one">
                            <div class="meta"><span>Juan</span><span>4.9</span></div>
                        </div>
                        <div class="portrait two">
                            <div class="meta"><span>Álvaro</span><span>5.0</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
